name: Build extension

# Compiles the Arsound Java extension module (what the gateway work changed) to catch compile
# errors. A full patched APK cannot be built on CI: it needs the closed SoundCloud APK (in the
# git-ignored local/ folder) and the signing keystore. This job only validates the extension.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3.2.1
        with:
          # Avoid the obsolete "tools" package the action otherwise tries to install (it 404s and
          # fails the step). Gradle/AGP downloads the platform and build-tools it needs itself.
          packages: ""

      - uses: gradle/actions/setup-gradle@v4.2.1

      - name: Compile the Arsound extension
        env:
          # The ReVanced Gradle plugin lives in GitHub Packages; the built-in token reads it.
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:arsound:assembleRelease --stacktrace --no-daemon
