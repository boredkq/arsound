name: Build extension

# Compiles the Arsound Java extension module (what the gateway work changed) to catch compile
# errors. A full patched APK cannot be built on CI: it needs the closed SoundCloud APK (in the
# git-ignored local/ folder) and the signing keystore. This job only validates the extension.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.5.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3.2.1
        with:
          # Avoid the obsolete "tools" package the action otherwise tries to install (it 404s and
          # fails the step). Gradle/AGP downloads the platform and build-tools it needs itself.
          packages: ""

      - uses: gradle/actions/setup-gradle@v4.2.1

      - name: Build patches bundle
        env:
          # The ReVanced Gradle plugin lives in GitHub Packages; the built-in token reads it.
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          # Only the .rvp bundle is needed. "assemble" builds it (and compiles the extension) but,
          # unlike "build", skips Android lint and tests — the project has pre-existing lint errors
          # unrelated to this change. sourcesJar trips a Gradle validation bug in the plugin, so skip it.
          ./gradlew assemble -x sourcesJar --stacktrace --no-daemon

      - name: Upload patches bundle (.rvp)
        uses: actions/upload-artifact@v4.4.3
        with:
          name: patches-rvp
          path: "**/*.rvp"
          if-no-files-found: error
